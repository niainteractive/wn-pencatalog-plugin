1.0.1:
    - Create the catalogue tables
    - create_tables.php
1.0.2:
    - Seed default types, groups and terms
    - seed_vocabularies.php
1.0.3:
    - Rating widened to 1-10 half points, Inspiration field, Nib Swappable vocabulary
    - update_rating_and_fields.php
1.0.4:
    - Photos stored as media paths; pickup command attaches dropped files by filename
    - update_photo_path.php
1.0.5:
    - "Videos box: embed code for one or more video reviews, shown at the bottom of the detail page"
    - update_videos_field.php
1.0.6:
    - "Backend forms fixed: Winter 1.3 renders the form tag and the save toolbar in the form behavior's view, which the plugin's one-line create/update overrides were replacing, leaving every form with no submit button"
    - "Standalone offer form gains a Pen picker, so an offer created outside a pen page can still be attached to one"

1.0.7:
    - "Member lists: a wish list and owned pens, each row linked to a catalogue entry"
    - create_member_pens.php

1.0.8:
    - "Ink log: one row per fill, current while cleaned_on is null"
    - create_ink_log.php

1.0.9:
    - "Every backend create and update view now renders the form tag and the save toolbar. Only items/update.htm had carried the 1.0.6 fix, so the other twelve forms rendered fields with no submit button"
    - "Member lists sort alphabetically by make then model, case-insensitive and natural, instead of newest first"
    - "The Favorites label is now Wish List, and wish-list actions return to /wishlist after the page moved from /favorites"
    - "Vendor model form config added to the repository. The vendor/ ignore rule is anchored to the repo root so models/vendor/ is no longer swallowed"

1.0.10:
    - "Gift list: a wish-list row can be marked as gifted instead of bought. It moves to its own gift list, keeps the price and date, and never lands in My Pens"
    - "Wish-list rows carry two actions, I bought it and I gifted it. A pen's page carries a third toggle so a gift can be added directly from the catalogue"
    - "member_pens gains a recipient column, shown only on gift rows, with the date field relabelled Gifted on"
    - add_recipient_to_member_pens.php

1.0.11:
    - "Saving a gift row returns to the gift list. The row form still carried the two-list return rule, so edits made on /gifts landed on /wishlist"

1.0.12:
    - "The recipient field on a gift row now saves. The plain /favorites/update route kept its own list of writable fields and recipient was missing from it, so the value was posted and discarded"
    - "Both save paths now read MemberPen::EDITABLE, so a field cannot be accepted by the AJAX handler and dropped by the route"

1.0.13:
    - "Member list pages no longer fail when a row has a date. MemberPen never declared acquired_on as a date, so Storm returned a string and the formatter called format() on it. Any row with Acquired or Gifted on filled in took the page down"

1.0.14:
    - "My Pens and Gift List gain a colour field for the variant you actually own, separate from the catalogue Colour term, which describes the model"
    - "A member row can carry its own photo. Uploads go to storage/app/media/mypens under the member id, and are served through /member-photo/{row}, which checks ownership before streaming"
    - "Remove the current photo with a checkbox on the row; replacing one deletes the old file"
    - add_variant_fields_to_member_pens.php

1.0.31:
    - "The table publishes the active search, make and rating values, so a sidebar rendered by the theme can show what is currently filtering the list. The header search now lands on /pens?q=."

1.0.30:
    - "The sidebar option is read through the component rather than an undefined template variable, so a sidebar page no longer prints a second copy of the filters above the table."

1.0.29:
    - "The pen table drops the Inspiration column, and the ink-system column is labelled Filler - 'Ink' read as the ink inside the pen rather than how it fills."

1.0.28:
    - "The catalogue's pagination uses the theme's own pagination markup (round page links, arrow ends) instead of the framework's default list, and keeps the active filters and sort in every page link."

1.0.27:
    - "The catalogue table drops the Nationality and Weight columns, in the standard view, the sidebar view and any make-filtered list. Both fields remain on the pen record and in the detail page."

1.0.26:
    - "A catalogue stats component publishes live counts (pens, makes, vendors, pens on members' shelves) so the home page can show numbers that are true."

1.0.25:
    - "The rating filter's options are handed to the page again, so the dropdown is no longer empty (it had been since the filter moved into its own partial)."

1.0.24:
    - "Live sidebar filtering: the AJAX filter handler now reads the posted values, so the table updates without a page load."

1.0.23:
    - "The table component can leave its filters to a theme sidebar (sidebar property), and its filter form now honours baseUrl, so the same catalogue can live at more than one URL."

1.0.22:
    - "The pen detail component no longer prints a second h1 now that the page heading carries the pen's name; the record heading is an h2."

1.0.21:
    - "A pen detail page now takes the pen's own name for its heading and browser title, instead of the generic page title from the CMS."

1.0.20:
    - "Backend-created pens now record who made them and, for anyone who is not a superuser, arrive unpublished. The publish action (single pen or bulk) is what puts them in front of the public, so an editor's work is reviewed before it is seen."

1.0.19:
    - "Pen Catalog > Demand ranks the pens members keep asking for: requests, distinct members, last asked, and whether the catalogue already lists it. Declined suggestions are excluded, so the report is the working list for what to add next."

1.0.18:
    - "Members can suggest a pen the catalogue does not list. Suggestions land in a backend queue with a status, so the catalogue is never touched directly and the queue doubles as a record of what to add next."
    - create_suggestions_table.php

1.0.17:
    - "Members can add a pen the catalogue does not list to their own shelf, wish list or gift list. The row is private to them, editable like any other, and needs no moderation; catalogue rows behave exactly as before."
    - add_private_pens_to_member_pens.php

1.0.16:
    - "The catalogue API now writes drafts. New pens arrive unpublished, tagged with their source, and reach the public only when someone publishes them in the backend. Adds a Pending/Published filter, Source and Verified columns, and a Publish button on the list."
    - add_draft_fields_to_items.php

1.0.15:
    - "The catalogue no longer fatals on a site without the Winter.User plugin. Member lookups go through a helper that returns null when the Auth alias is unavailable, so Pens and Makes render on a clean install; sites with Winter.User keep the wish list and my-pens columns."

1.0.32:
    - "Member lists now record one row per physical pen. The unique key that allowed only one of each pen per list is gone, so two X450s in different colours can both sit on My Pens or the Gift List, each with its own colour, price, photo and recipient. quantity is retired: counting a shelf is counting rows."
    - "The ink log attaches a fill to the specific pen rather than the model, so two copies in different colours stay distinct, and existing entries are pointed at the member's owned row for that pen."
    - member_copies_and_ink_pen.php
