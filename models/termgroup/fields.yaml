fields:
    name:
        label: Group name
        span: left
        required: 1
        comment: e.g. Nationality, Shape / Style, Doors, Engine
    is_multi:
        label: Allow more than one value per pen
        type: switch
        default: true
        span: right
    description:
        label: Description
        type: textarea
        size: small
        span: full
        comment: Optional. Reminds everyone what this group is for.
    is_active:
        label: Active
        type: switch
        default: true
        span: left
