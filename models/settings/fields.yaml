fields:
    require_login:
        label: Require a front-end login to view the catalog
        comment: Turn this off to make the catalog publicly readable.
        type: switch
        default: true
        span: left
    show_offers:
        label: Show purchase offers on the detail page
        comment: Lengths are stored in millimetres, weight in grams. No conversion is applied.
        type: switch
        default: true
        span: right
    default_currency:
        label: Default currency
        comment: Three-letter code, e.g. USD, EUR, GBP.
        type: text
        default: USD
        span: left
    rows_per_page:
        label: Rows per page
        type: number
        default: 50
        span: right

    api_enabled:
        label: Enable the catalogue API
        comment: Lets an external agent read and write pens with a bearer token.
        type: switch
        default: false
        span: left
    api_allow_writes:
        label: API may create and edit records
        comment: Turn off to make the token read-only.
        type: switch
        default: false
        span: right
    api_token:
        label: API token
        comment: Send as "Authorization: Bearer <token>". Clear it to revoke access.
        span: full
