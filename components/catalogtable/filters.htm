<form method="get" action="/pens" style="margin:0 0 14px 0">
    <div style="display:flex; flex-wrap:wrap; gap:10px; align-items:flex-end">
        <label>Make<br>
            <input type="text" name="make" value="{{ get.make }}" placeholder="e.g. pilot" style="padding:4px">
        </label>

        <label>Rating at least<br>
            <select name="rating" style="padding:4px">
                <option value="">Any</option>
                {% for r in ratingOptions %}
                    <option value="{{ r }}" {% if get.rating == r %}selected{% endif %}>{{ r }}</option>
                {% endfor %}
            </select>
        </label>

        <button type="submit" style="padding:5px 12px">Filter</button>
        <a href="{{ 'pens'|page }}" style="padding:5px 12px">Reset</a>
    </div>

    {% for groupSlug, terms in filterLinks %}
        <div style="margin-top:8px; font-size:13px">
            <strong>{{ groupLabels[groupSlug] ?? groupSlug }}:</strong>
            {% for slug, meta in terms %}
                <a href="{{ meta.url }}"
                   style="display:inline-block; margin:2px 4px 2px 0; padding:2px 7px; border:1px solid #ccc; border-radius:10px; text-decoration:none; {% if meta.active %}background:#222; color:#fff{% endif %}">
                    {{ meta.name }}
                </a>
            {% endfor %}
        </div>
    {% endfor %}
</form>
