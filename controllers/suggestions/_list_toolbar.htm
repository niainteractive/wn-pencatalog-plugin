<div data-control="toolbar">
    <button
        class="btn btn-success oc-icon-check"
        disabled="disabled"
        onclick="$(this).data('request-data', { checked: $('.control-list').listWidget('getChecked') })"
        data-request="onPromote"
        data-request-confirm="Mark the selected suggestions as added to the catalogue?"
        data-trigger-action="enable"
        data-trigger=".control-list input[type=checkbox]"
        data-trigger-condition="checked"
        data-request-success="$(this).prop('disabled', true)"
        data-stripe-load-indicator>
        Added
    </button>

    <button
        class="btn btn-default oc-icon-times"
        disabled="disabled"
        onclick="$(this).data('request-data', { checked: $('.control-list').listWidget('getChecked') })"
        data-request="onDecline"
        data-request-confirm="Mark the selected suggestions as declined?"
        data-trigger-action="enable"
        data-trigger=".control-list input[type=checkbox]"
        data-trigger-condition="checked"
        data-request-success="$(this).prop('disabled', true)"
        data-stripe-load-indicator>
        Declined
    </button>
</div>
